<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دوبامين | Dopamine Team</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("dp-theme")==="dark"?"dark":"light"}catch(e){}</script>
<style>
:root{--navy:#0b1f6b;--green:#14994f;--teal:#12a0c8;--bg1:#eaf6fb;--bg2:#e6f5ec;--ink:#0d1b3d;--mut:#4a5877;--glass:rgba(255,255,255,.55);--gb:rgba(255,255,255,.8);--sh:0 10px 40px rgba(11,31,107,.12);--grad:linear-gradient(120deg,var(--navy),var(--teal) 55%,var(--green));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg1:#071236;--bg2:#06261f;--ink:#eaf2ff;--mut:#a9b8d8;--glass:rgba(255,255,255,.08);--gb:rgba(255,255,255,.18);--sh:0 10px 40px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-padding-top:90px}
body{margin:0;font-family:Tajawal,Cairo,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2));background-attachment:fixed;min-height:100vh;line-height:1.8;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:45vmax;height:45vmax;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;pointer-events:none}
body::before{background:var(--teal);top:-15vmax;right:-10vmax}body::after{background:var(--green);bottom:-18vmax;left:-12vmax}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--gb);border-radius:24px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.5)}
header{position:sticky;top:0;z-index:20;margin:10px;padding:8px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.35rem;text-decoration:none;color:var(--navy)}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:Arial,sans-serif;letter-spacing:-.5px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{padding:6px 14px;border-radius:99px;text-decoration:none;color:var(--ink);font-weight:500;transition:.25s}
nav a:hover,nav a.on{background:var(--grad);color:#fff;box-shadow:0 4px 16px rgba(18,160,200,.4)}
.btn{display:inline-block;border:0;cursor:pointer;font:inherit;font-weight:700;padding:10px 24px;border-radius:99px;background:var(--grad);color:#fff;text-decoration:none;transition:.25s;box-shadow:0 6px 22px rgba(18,160,200,.35)}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,153,79,.4)}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--gb);box-shadow:none}
.btn.sm{padding:6px 16px;font-size:.9rem}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
section{margin:36px 0}h1,h2,h3{line-height:1.3;margin:0 0 10px}
h2{font-size:1.9rem;color:var(--navy)}:root[data-theme="dark"] h2{color:#8fd8f0}
.hero{padding:44px 24px;text-align:center;position:relative;overflow:hidden}
.mark{font-family:Arial,sans-serif;font-weight:800;font-size:clamp(3rem,11vw,6.5rem);letter-spacing:-2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;direction:ltr;display:inline-block;transition:transform .4s}
.mark:hover{transform:scale(1.05) rotate(-1.5deg)}
.hand{width:min(380px,80%);display:block;margin:6px auto;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.tri{display:flex;gap:18px;justify-content:center;font-weight:800;font-size:1.3rem;margin:8px 0}
.tri span:nth-child(1){color:var(--navy)}.tri span:nth-child(2){color:var(--teal)}.tri span:nth-child(3){color:var(--green)}
.slogan{font-size:1.6rem;font-weight:800;margin:10px 0}.lead{color:var(--mut);max-width:620px;margin:0 auto 20px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{padding:22px;transition:.3s}.card:hover{transform:translateY(-6px);box-shadow:0 18px 50px rgba(18,160,200,.25)}
.card .ic{font-size:2rem}.muted{color:var(--mut)}
.tag{display:inline-block;font-size:.8rem;padding:2px 12px;border-radius:99px;background:rgba(18,160,200,.15);color:var(--teal);font-weight:700}
.seats{font-weight:800;color:var(--green)}.seats.low{color:#d6402b}
.bar{height:8px;border-radius:9px;background:rgba(120,140,170,.25);overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--grad);transition:width .6s}
.org{display:flex;flex-direction:column;align-items:center;gap:14px}.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.node{padding:12px 22px;text-align:center;min-width:150px;font-weight:700;transition:.3s}.node:hover{transform:scale(1.06)}.node small{display:block;font-weight:400;color:var(--mut)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--gb);background:var(--glass);color:var(--ink);font:inherit;padding:5px 16px;border-radius:99px;cursor:pointer}.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.tile{height:190px;border-radius:20px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;font-weight:700;position:relative;overflow:hidden;transition:.35s;cursor:pointer}
.tile:hover{transform:scale(1.04)}.tile .big{position:absolute;top:12px;left:16px;font-size:2.4rem;opacity:.9}.tile small{font-weight:400;opacity:.9}
form{display:grid;gap:14px}label{font-weight:700;font-size:.95rem;display:block;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:11px 14px;border-radius:14px;border:1px solid var(--gb);background:var(--glass);color:var(--ink);outline:0;transition:.2s}
input:focus,select:focus,textarea:focus,.btn:focus-visible,a:focus-visible{box-shadow:0 0 0 3px rgba(18,160,200,.5)}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500;padding:5px 14px;border-radius:99px;border:1px solid var(--gb);background:var(--glass);cursor:pointer}.checks input{width:auto}
.soc{display:flex;gap:12px;flex-wrap:wrap}.soc a{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:1.5rem;text-decoration:none;color:#fff;background:var(--grad);transition:.3s}.soc a:hover{transform:translateY(-6px) rotate(8deg);box-shadow:0 0 28px var(--teal)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--gb)}th{color:var(--teal)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,120px);padding:12px 26px;z-index:50;transition:.4s;font-weight:700}.toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(5,15,45,.5);display:none;place-items:center;z-index:40;padding:16px}.modal.show{display:grid}.modal .glass{max-width:440px;width:100%;padding:24px;background:var(--bg1)}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}.stats .glass{padding:14px 24px;font-weight:800;font-size:1.6rem;color:var(--green)}.stats small{display:block;font-size:.85rem;color:var(--mut);font-weight:500}
footer{text-align:center;padding:24px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:640px){nav{order:3;width:100%;justify-content:center}}
.btn svg{vertical-align:middle;margin-inline-end:6px}.tile{background-size:cover}.node[role=button]:focus-visible{outline:3px solid var(--teal)}
#mbox{max-height:88vh;overflow:auto}
.herologo{width:min(440px,90%);margin:0 auto 14px;border-radius:24px}.herologo img{width:100%;height:auto;display:block}
:root[data-theme="dark"] .herologo{background:rgba(255,255,255,.93);padding:12px}
.bfly{position:fixed;left:0;top:0;width:96px;height:78px;z-index:60;pointer-events:none;animation:fly 3.8s cubic-bezier(.45,.05,.55,.95) forwards;filter:drop-shadow(0 6px 10px rgba(11,31,107,.35))}
.bfly svg{width:100%;height:100%;overflow:visible}.bfly .w{transform-origin:50px 40px;animation:flap .2s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.18)}}
@keyframes fly{0%{transform:translate(calc(50vw - 48px),55vh) scale(.2) rotate(0);opacity:0}
 12%{opacity:1;transform:translate(calc(50vw - 48px),42vh) scale(1) rotate(-12deg)}
 32%{transform:translate(28vw,30vh) scale(1.05) rotate(14deg)}
 52%{transform:translate(66vw,22vh) scale(1) rotate(-14deg)}
 76%{transform:translate(82vw,10vh) scale(.9) rotate(10deg);opacity:1}
 100%{transform:translate(112vw,-12vh) scale(.7) rotate(-8deg);opacity:0}}
@media(prefers-reduced-motion:reduce){.bfly{display:none}}
.avw{position:relative;display:inline-block;vertical-align:middle}
.av{display:grid;place-items:center;border-radius:50%;overflow:hidden;background:var(--grad);color:#fff;font-weight:800;border:3px solid var(--gb);box-shadow:var(--sh)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avedit{position:absolute;bottom:-2px;left:-2px;width:26px;height:26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:.8rem;cursor:pointer;border:2px solid var(--gb)}
:root{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
</style>
</head>

function bind(k){
 if(k==="gallery"){let a="الكل",b="كل السنوات";
  const bg=x=>x.img&&x.img.startsWith("data:image/jpeg;base64,")&&!/['"\)\s]/.test(x.img)?`linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.72)),url('${x.img}') center/cover`:`linear-gradient(135deg,${/^[#\w,]+$/.test(x.c||"")?x.c:"#0b1f6b,#12a0c8"})`;
  const draw=()=>{$("#gg").innerHTML=S.gallery.filter(x=>(a==="الكل"||x.ty===a)&&(b==="كل السنوات"||x.y===b)).map(x=>`<div class="tile" style="background:${bg(x)}" ${/^https:\/\//.test(x.url||"")?`data-u="${esc(x.url)}" onclick="window.open(this.dataset.u,'_blank','noopener')"`:""}><span class="big">${esc(x.e||"📸")}</span>${admin?`<button class="btn sm" style="position:absolute;top:8px;right:8px" onclick="event.stopPropagation();delG(${x.id})">حذف</button>`:""}<small>${esc(x.ty)} · ${esc(x.y)}</small>${esc(x.t)}</div>`).join("")||'<p class="muted">لا نتائج.</p>'};
  [["#f1",v=>a=v],["#f2",v=>b=v]].forEach(([s,f])=>$(s).onclick=e=>{const c=e.target.closest(".chip");if(!c)return;$(s).querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");f(c.dataset.v);draw()});draw()}
 if(k==="join")$("#jf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
  S.members.push({name:f.get("name"),uid:f.get("uid"),phone:f.get("phone"),email:f.get("email"),major:f.get("major"),skills:[...f.getAll("sk"),f.get("other")].filter(Boolean).join("، "),why:f.get("why"),user:me?me.id:null,status:"قيد المراجعة"});save();e.target.reset();toast("تم استلام طلبك، أهلًا بك في دوبامين 💚")};
 if(k==="contact")$("#cf").onsubmit=e=>{e.preventDefault();e.target.reset();toast("وصلتنا رسالتك، سنرد عليك قريبًا")};
 if(k==="account"){
  if(me)$("#lo2").onclick=()=>{me=null;try{sessionStorage.removeItem("dp-me")}catch(e){}route()};
  else{
   $("#lg").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const u=S.users.find(x=>x.u.toLowerCase()===f.get("u").trim().toLowerCase());if(u&&await H(f.get("p"),u.s)===u.h){me=u;try{sessionStorage.setItem("dp-me",u.id)}catch(x){}toast("أهلًا بعودتك");route()}else toast("اسم المستخدم أو كلمة المرور غير صحيحة")}catch(x){toast("المتصفح لا يدعم التشفير هنا، افتح الموقع عبر https")}};
   $("#sg").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),u=f.get("u").trim(),p=f.get("p");
    if(!/^[\w\u0600-\u06FF.]{3,20}$/.test(u))return toast("اسم المستخدم 3–20 حرفًا بدون مسافات");
    if(p.length<6)return toast("كلمة المرور 6 أحرف على الأقل");
    if(p!==f.get("p2"))return toast("كلمتا المرور غير متطابقتين");
    if(u==="0000"||S.users.some(x=>x.u.toLowerCase()===u.toLowerCase()))return toast("اسم المستخدم مستخدم");
    try{const s=rs(),n={id:Date.now(),u,s,h:await H(p,s),at:new Date().toISOString().slice(0,10)};S.users.push(n);if(!save()){S.users.pop();return}me=n;try{sessionStorage.setItem("dp-me",n.id)}catch(x){}toast("تم إنشاء حسابك 🎉");route()}catch(x){toast("المتصفح لا يدعم التشفير هنا، افتح الموقع عبر https")}}}}
 if(k==="admin"){
  if(!admin)$("#lf").onsubmit=async e=>{e.preventDefault();if(Date.now()<lockUntil)return toast("محاولات كثيرة، انتظر 30 ثانية");const f=new FormData(e.target);
   try{if(f.get("u")===ADMIN.u&&await H(f.get("p"),ADMIN.s)===ADMIN.h){admin=true;fails=0;route()}else{if(++fails>=5){lockUntil=Date.now()+30000;fails=0}toast("بيانات الدخول غير صحيحة")}}catch(x){toast("المتصفح لا يدعم التشفير هنا، افتح الموقع عبر https")}};
  else{
   const draw=()=>{const q=$("#q").value.trim();$("#mt").innerHTML=S.members.filter(m=>JSON.stringify(m).includes(q)).map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.uid)}</td><td>${esc(m.phone)}</td><td>${esc(m.email)}</td><td>${esc(m.skills)}</td><td><button class="btn ghost sm" onclick="cyc(${S.members.indexOf(m)})">${esc(m.status||"قيد المراجعة")}</button></td><td><button class="btn ghost sm" onclick="delMem(${S.members.indexOf(m)})">حذف</button></td></tr>`).join("")||'<tr><td colspan="7" class="muted">لا طلبات مطابقة.</td></tr>'};
   $("#q").oninput=draw;draw();$("#lo").onclick=()=>{admin=false;route()};
   $("#ex").onclick=()=>dl("members.csv",[["الاسم","الرقم الجامعي","الهاتف","البريد","التخصص","المهارات","الحالة"],...S.members.map(m=>[m.name,m.uid,m.phone,m.email,m.major,m.skills,m.status||""])]);
   $("#nf").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);S.news.unshift({t:f.get("t"),d:f.get("d")});save();toast("تم نشر الخبر");route()};
   $("#sf").onsubmit=e=>{e.preventDefault();S.site.lead=new FormData(e.target).get("lead").trim();save();toast("تم الحفظ")};
   $("#gf").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),file=f.get("file"),url=(f.get("url")||"").trim();let img="";
    if(url&&!/^https:\/\//i.test(url))return toast("الرابط يجب أن يبدأ بـ https://");
    try{if(file&&file.size)img=await shrink(file)}catch(x){return toast("تعذر قراءة الصورة (png/jpg/webp فقط)")}
    S.gallery.unshift({id:Date.now(),t:f.get("t"),ty:f.get("ty"),y:f.get("y").trim(),e:"📸",img,url});if(save()){toast("تمت الإضافة");route()}else S.gallery.shift()}}}}

function applyModal(id){const e=S.events.find(x=>x.id===id);
 $("#mbox").innerHTML=`<h3>التقديم على: ${esc(e.title)}</h3><form id="af"><div><label>الاسم الكامل</label><input name="n" required></div><div><label>الرقم الجامعي</label><input name="u" required></div><div><label>الهاتف</label><input name="p" required type="tel"></div><div style="display:flex;gap:8px"><button class="btn">تأكيد التقديم</button><button type="button" class="btn ghost" onclick="closeM()">إلغاء</button></div></form>`;
 $("#modal").classList.add("show");
 $("#af").onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target);
  if(left(e)<=0){toast("اكتمل العدد");return}
  if(S.apps.some(a=>a.ev===id&&a.uid===f.get("u"))){toast("هذا الرقم الجامعي قدّم مسبقًا");return}
  S.apps.push({ev:id,name:f.get("n"),uid:f.get("u"),phone:f.get("p"),user:me?me.id:null});save();closeM();toast("تم تسجيلك في الفعالية ✅");route()}}
function dl(n,rows){const csv="\ufeff"+rows.map(r=>r.map(c=>{c=String(c);if(/^[=+\-@]/.test(c))c="\u2019"+c;return '"'+c.replace(/"/g,'""')+'"'}).join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=n;a.click()}
function exApps(id){if(!admin)return;dl("applicants.csv",[["الاسم","الرقم الجامعي","الهاتف"],...S.apps.filter(a=>a.ev===id).map(a=>[a.name,a.uid,a.phone])])}
function delMem(i){if(!admin)return;if(confirm("حذف هذا العضو؟")){S.members.splice(i,1);save();route()}}
function delNews(i){if(!admin)return;S.news.splice(i,1);save();route()}

function shrink(file,max=900){return new Promise((ok,no)=>{if(!/^image\/(png|jpe?g|webp)$/.test(file.type))return no();const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",0.8))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
